docs:
  - {id: doc:dr-runbook, title: "DR Failover Runbook", section: "§3",
     text: "During a regional failover, the dr-failover job runs as deployer and requires ADMIN on prod-customers-db to promote the replica. Without it, promotion fails and the failover stalls."}
  # Distractors (Part D, SD-3): they mention deployer with dependency-sounding verbs, but none of them blocks a P0 revocation.
  - {id: doc:deploy-runbook, title: "Deploy Pipeline Runbook", section: "§2",
     text: "The nightly artifact sweeper runs as deployer and needs WRITES on artifacts-bucket to prune old builds. Releases themselves publish through release-publisher."}
  - {id: doc:inc-2291, title: "Postmortem INC-2291", section: "Findings",
     text: "The 2025 pentest flagged deployer READS on billing-secrets. Nothing uses it since the vault migration; the old deploy scripts that needed it were deleted. Recommendation: revoke."}
  - {id: doc:onboarding, title: "Platform Onboarding Guide", section: "§5",
     text: "New platform engineers need the deployer role to run deploys; request it through a SEC ticket. The platform-ci group used to need db-maint for schema migrations, but since the 2026 migration tool rewrite nobody requires it."}
  - {id: doc:access-policy-v3, title: "Access Policy v3", section: "§4",
     text: "The deployer role is deploy-only. Grants held by deployer may write build artifacts and run deploy jobs. deployer must not hold admin or read access to production data stores or secrets."}
  - {id: doc:ci-sa-standard, title: "CI Service Account Standard", section: "§2",
     text: "CI service accounts may join CI groups and assume deploy roles. They must not hold direct data access."}
  - {id: doc:release-runbook, title: "Release Runbook", section: "§1",
     text: "The release job runs as ci-deploy and assumes release-publisher to upload artifacts. It does not use deployer."}
