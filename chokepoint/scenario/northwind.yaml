# Northwind Labs: the hand-designed scenario overlay (synthetic data, rule 6).
#
# Every name, person and ticket here is fictional.
# generate.py adds templated noise around this core.
#
# Grant cost is derived from usage, never typed by hand:
#   cost = 1 + ceil(log2(1 + uses_30d))
#
#   F-1 attack graph (ATTACK edges; grants are nodes):
#
#   F-1 ─entry─▶ ci-deploy-token ─auth_as─▶ ci-deploy
#                                           │ G-101 CAN_ASSUME (uses 3, cost 3)    ─▶ deployer
#                                           │ G-105 MEMBER_OF  (uses 40, cost 7)   ─▶ platform-ci
#                                           │ G-108 CAN_ASSUME (uses 140, cost 9)  ─▶ release-publisher ─G-109─▶ artifacts-bucket
#   deployer ─G-102 ADMIN_TO (uses 0, cost 1)─▶ prod-customers-db   ★ jewel  (the DR grant: only the runbook knows)
#   deployer ─G-103 READS    (uses 0, cost 1)─▶ billing-secrets     ★ jewel
#   deployer ─G-104 WRITES   (uses 61, cost 7)─▶ artifacts-bucket
#   platform-ci ─G-106 CAN_ASSUME (uses 2, cost 3)─▶ db-maint ─G-107 READS (uses 12, cost 5)─▶ prod-customers-db
#
#   routes = 2 independent routes (via G-101, and via G-105/G-106/G-107)
#   P0 (cheapest) = {G-102, G-103, G-106}, cost 5   (routes 2 <= |P0| 3: Menger, strictly less)
#   P1 (keep G-102, the DR grant) = {G-101, G-106}, cost 6
#   keyword baseline (keeps G-102, G-103 and G-106) = {G-101, G-107}, cost 8  (wrong)

